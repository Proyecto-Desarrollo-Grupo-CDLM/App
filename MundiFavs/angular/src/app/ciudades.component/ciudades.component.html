<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <div class="card-title">
        <i class="fa fa-search"></i> Búsqueda de Ciudades y Destinos (Operación 3.1)
      </div>
    </div>
    <div class="card-body">
      
      <form class="row row-cols-lg-auto g-3 align-items-center mb-4" (ngSubmit)="buscar()">
        <div class="col-12 flex-grow-1">
          <div class="input-group">
            <input 
              name="CityNamePrefix" 
              type="text" 
              [(ngModel)]="textoBusqueda" 
              class="form-control" 
              placeholder="Ingrese nombre parcial de la ciudad (ej: 'Rio', 'Santiag')..." />
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary" [disabled]="cargando || !textoBusqueda">
            <i class="fa fa-spinner fa-spin" *ngIf="cargando"></i>
            {{ cargando ? 'Buscando...' : 'Buscar' }}
          </button>
        </div>
      </form>

      <hr>

      <h4>Resultados de la Búsqueda</h4>

      <div *ngIf="cargando" class="text-center p-4">
        <i class="fa fa-spinner fa-spin fa-2x"></i>
        <p class="mt-2">Cargando resultados de la API externa...</p>
      </div>

      <div *ngIf="!cargando && ciudades.length === 0 && textoBusqueda" class="alert alert-info">
        No se encontraron ciudades que coincidan con "{{ textoBusqueda }}".
      </div>

      <ul id="CityResultsList" class="list-group">
        <li *ngFor="let city of ciudades" class="list-group-item d-flex justify-content-between align-items-center">
          <div>
            <strong>{{ city.nombreCiudad }}</strong>, {{ city.region }} ({{ city.pais }})
          </div>
          <button class="btn btn-sm btn-outline-success">
            <i class="fa fa-heart"></i> Guardar
          </button>
        </li>
      </ul>
      
    </div>    </div>    </div>      ```
