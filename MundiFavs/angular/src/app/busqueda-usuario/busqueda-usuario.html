<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 text-center">

      <h2 class="fw-bold text-primary mb-3">
        <i class="fas fa-users me-2"></i> Buscar Viajeros
      </h2>
      <p class="text-muted mb-4">
        Encuentra a otros usuarios de MundiFavs, descubre sus destinos favoritos y conecta con ellos.
      </p>

      <div class="user-search-container position-relative text-start">
        
        <div class="input-group input-group-lg shadow-sm rounded-3">
          <span class="input-group-text bg-white border-end-0 text-primary">
            <i class="fas fa-search"></i>
          </span>
          <input
            type="text"
            class="form-control border-start-0 ps-0 form-control-lg"
            placeholder="Escribe un nombre o usuario..."
            [(ngModel)]="searchText"
            (input)="onSearch(searchText)"
          />
        </div>

        @if (users.length > 0) {
          <ul class="list-group position-absolute w-100 shadow-lg z-index-master search-results">
            @for (user of users; track user.id) {
              <li class="list-group-item list-group-item-action cursor-pointer p-3 border-0 border-bottom" 
                  (click)="goToProfile(user.id)">
                <div class="d-flex align-items-center">
                  <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-2 me-3 d-flex justify-content-center align-items-center" style="width: 40px; height: 40px;">
                    <i class="fas fa-user"></i>
                  </div>
                  <div>
                    <h6 class="mb-0 fw-bold text-dark">{{ user.name }} {{ user.surname }}</h6>
                    <small class="text-muted">&#64;{{ user.userName }}</small>
                  </div>
                </div>
              </li>
            }
          </ul>
        }
      </div>

    </div>
  </div>
</div>
